version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-campus-backend
    restart: always
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=smart-campus-jwt-production-secret-change-this-in-env-file-2026
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - COLLEGE_NAME=S. B. Jain Institute of Technology, Management & Research
      - COLLEGE_SHORT_NAME=SBJIT
      - COLLEGE_EMAIL_DOMAIN=sbjit.edu.in
      - DEV_MODE=false
      - AUTO_VERIFY_EMAILS_IN_DEV=true
      - CLIENT_URL=http://localhost
    volumes:
      - backend-db:/app/prisma
      - backend-storage:/app/storage
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: smart-campus-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-db:
  backend-storage:
